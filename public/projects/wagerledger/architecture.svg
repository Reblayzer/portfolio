<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2320 1330" data-inline="true" role="img" aria-labelledby="wagerledger-arch-title wagerledger-arch-desc">
<title id="wagerledger-arch-title">WagerLedger architecture</title>
<desc id="wagerledger-arch-desc">A client sends commands to an ASP.NET Core API. On the write side the API loads and replays a wallet aggregate, which appends events to KurrentDB. The API publishes to RabbitMQ, which feeds a deposit-limit watcher and a projector. On the read side the projector builds a SQL Server read model, which the API queries directly.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-muted-foreground, #52525b)"/></marker>
  <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-accent, #2563eb)"/></marker>
</defs>
