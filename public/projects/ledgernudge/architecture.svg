<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2840 1840" data-inline="true" role="img" aria-labelledby="ledgernudge-arch-title ledgernudge-arch-desc">
<title id="ledgernudge-arch-title">LedgerNudge dunning loop</title>
<desc id="ledgernudge-arch-desc">A scheduled dunning:advance job puts past-due steps on a Redis queue. The queue feeds DunningDraftService, which drafts a message with Anthropic Claude and writes it to PostgreSQL as pending_approval. An operator inbox reads from Postgres; approving returns the job to the queue, which dispatches MessageSender to send email or SMS through Twilio. Inbound replies go to InboundReplyService, which classifies them with Claude and records disputes to Postgres, pausing the sequence. Separately the operator creates a Stripe payment link, and Stripe webhooks are reconciled back into Postgres.</desc>
