<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3380 1580" data-inline="true" role="img" aria-labelledby="bunkerflow-arch-title bunkerflow-arch-desc">
<title id="bunkerflow-arch-title">BunkerFlow architecture</title>
<desc id="bunkerflow-arch-desc">Four simulated sources feed three thin adapters: a trading desk and an ERP, both REST, share a scheduled batch puller; port telemetry arrives over Kafka; and any system can push to a REST gateway. All three adapters converge on one ingestion pipeline that normalizes, validates, dedupes and publishes. Accepted records go to an Azure Service Bus topic and rejected ones to a dead-letter queue. A landing worker reads the topic and writes Postgres for the query API and date-partitioned Parquet for the lakehouse, which Databricks reads into Delta tables.</desc>
